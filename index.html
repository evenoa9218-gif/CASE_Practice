<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<script>
// 테마: MCQ와 동일한 토큰 체계. 기본 라이트.
(function(){
  var t = localStorage.getItem('cp_theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
})();

<style>
/* ── MCQ(선택형 페이지)와 동일한 색 토큰 ─────────────── */
:root[data-theme="dark"]{
  --bg:#10192a; --sf:#172238; --sf2:#1d2d48; --bd:#284060; --bd2:#1e3254;
  --gold:#7ab8d8; --gold2:#9acce8; --gf:#2e6282;
  --tx:#cce6f8; --tx2:#6aa8cc; --tx3:#366078;
  --hd:#0c1424; --ok:#4caf7d; --no:#e2685f; --shadow:0 1px 3px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#ecf4fb; --sf:#ffffff; --sf2:#dceef8; --bd:#b4d0e8; --bd2:#cce0f2;
  --gold:#2464a0; --gold2:#2e74b5; --gf:#2a5f88;
  --tx:#192233; --tx2:#3a5870; --tx3:#5878a0;
  --hd:#16233a; --ok:#2e7d55; --no:#c4463c; --shadow:0 1px 3px rgba(30,60,100,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
#root{min-height:100vh}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--gold)}
.wrap{max-width:1080px;margin:0 auto;padding:16px}

.hd{background:var(--hd);color:#e8f2fb;padding:13px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;z-index:30}
.hd h1{margin:0;font-size:16.5px;letter-spacing:-.02em;font-weight:700}
.hd .sub{font-size:11.5px;opacity:.72;margin-top:2px}

.btn{background:var(--sf);color:var(--tx);border:1px solid var(--bd);
  border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--gold2)}
.btn:disabled{opacity:.42;cursor:default}
.btn.ghost{background:transparent;color:#cfe3f5;border-color:rgba(255,255,255,.22)}
.btn.ghost:hover{border-color:#9acce8}
select.btn{padding:7px 10px}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;
  padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;
  background:var(--sf2);color:var(--tx2);border:1px solid var(--bd2)}
.tag.on{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:600}
.tag.gold{background:var(--sf2);color:var(--gold);border-color:var(--gold);font-weight:600}
.tag.ok{background:var(--sf2);color:var(--ok);border-color:var(--ok)}
.tag.click{cursor:pointer}
.tag.click:hover{border-color:var(--gold)}
.muted{color:var(--tx3);font-size:12px}
.title{font-size:14.5px;font-weight:700;margin:0 0 9px;color:var(--tx)}
.pre{white-space:pre-wrap;word-break:break-word;font-size:14.8px;line-height:1.9;
  color:var(--tx)}

textarea{width:100%;background:var(--sf);color:var(--tx);border:1px solid var(--bd);
  border-radius:10px;padding:14px;font-size:15px;line-height:1.9;font-family:inherit;
  resize:vertical;min-height:300px}
textarea:focus{outline:none;border-color:var(--gold)}
input[type=text]{background:var(--sf);color:var(--tx);border:1px solid var(--bd);
  border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit}
input[type=text]:focus{outline:none;border-color:var(--gold)}

.grid{display:grid;gap:10px}
@media(min-width:720px){.grid.c2{grid-template-columns:1fr 1fr}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.tab{padding:10px 14px;font-size:13.5px;color:var(--tx2);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:700}
.bar{height:6px;background:var(--sf2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold)}
.empty{text-align:center;color:var(--tx3);padding:44px 16px}
.kv{display:flex;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--bd2)}
.kv b{color:var(--tx2);font-weight:500;min-width:74px}
.banner{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;
  padding:11px 14px;margin-bottom:12px;font-size:13px}

/* 문항 페이지 네비게이션 */
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--sf);border:1px solid var(--bd);border-radius:12px;
  padding:10px 13px;margin-bottom:11px;position:sticky;top:56px;z-index:20;
  box-shadow:var(--shadow)}
.pagedots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:1}
.dot{min-width:34px;text-align:center;font-size:12px;padding:5px 9px;border-radius:7px;
  border:1px solid var(--bd);background:var(--sf2);color:var(--tx2);cursor:pointer}
.dot.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.dot.filled{border-color:var(--ok);color:var(--ok)}
.dot.on.filled{background:var(--ok);border-color:var(--ok);color:#fff}

details.prob>summary{cursor:pointer;font-size:13.5px;color:var(--tx2);
  padding:4px 0;user-select:none}
details.prob>summary:hover{color:var(--gold)}

/* 문제 화면: 지문/문제/조문 구분 */
.factbox{background:var(--sf2);border:1px solid var(--bd2);border-radius:10px;
  padding:14px 16px;margin-top:10px}
.qtext{font-weight:700;margin-top:14px}
.refbox{margin-top:14px;padding-top:12px;border-top:2px dashed var(--bd2);
  font-size:12.5px;line-height:1.75;color:var(--tx2)}
</style>
</head>
<body>
<div id="root"><div class="loading">⚖ 불러오는 중...</div></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const SUBJECT = "공법";
const ROUNDS = [1,2,3,4];
const URLQ = new URLSearchParams(location.search);
const INCOMING_ISSUE = URLQ.get("issue");

const fmtDate = ts => { const d=new Date(ts), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const mmss = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

// 지문(사실관계) / 문제(설문) / 조문(참조조문 등)을 블록으로 나눠 가독성을 높인다.
// 한 시험에 사례가 여러 개 이어 붙은 경우 "<문제>"·"[참조조문]" 류 표지가 사례마다
// 반복되므로, 등장 순서대로 훑으며 지문↔문제↔조문을 번갈아 분리한다. 표지들 사이에
// 다음 사례의 지문이 곧바로 이어 붙는 경우도 있어 완벽하진 않지만, 표지를 아예 못 찾으면
// 안전하게 전체를 지문 한 덩어리로 둔다.
const MARK_RE = /[<\[【]\s*(문\s*제|참조\s*조문|참고\s*조문|참조\s*법령|참고\s*법령|관련\s*법령|참고\s*자료|심판대상조문)\s*[>\]】]/g;
const isNumberedPara = p => /^\(?\d+\)?[.．]/.test(p.trim());

function splitQuestionRun(chunk){
  const paras = chunk.split(/\n[ \t]*\n/).map(p=>p.trim()).filter(Boolean);
  let j=0;
  while(j<paras.length && isNumberedPara(paras[j])) j++;
  return {question:paras.slice(0,j).join('\n\n'), rest:paras.slice(j).join('\n\n')};
}

// 지문 텍스트 안에 표지 없이 곧바로 번호매김 설문이 이어지는 경우(예: 첫 사례 앞)를 대비해
// fact 블록을 넣을 때도 한 번은 암묵적 분리를 시도한다.
function pushFact(blocks, text){
  // 표지 없이 사례가 여러 개 이어 붙기도 하므로, 남은 텍스트에서 다음 번호매김
  // 설문 구간을 못 찾을 때까지 반복해서 지문↔문제를 계속 갈라낸다.
  let remaining = text;
  while(remaining){
    const paras = remaining.split(/\n[ \t]*\n/).map(p=>p.trim()).filter(Boolean);
    if(!paras.length) return;
    let i=0;
    while(i<paras.length && !isNumberedPara(paras[i])) i++;
    if(i>=paras.length){
      blocks.push({type:'fact', text:paras.join('\n\n')});
      return;
    }
    if(i>0) blocks.push({type:'fact', text:paras.slice(0,i).join('\n\n')});
    const {question,rest} = splitQuestionRun(paras.slice(i).join('\n\n'));
    if(question) blocks.push({type:'question', text:question});
    if(!rest || rest===remaining) return; // 진행이 없으면 무한루프 방지
    remaining = rest;
  }
}

function splitProblemText(text){
  if(!text) return [];
  const markers = [...text.matchAll(MARK_RE)];
  const blocks = [];
  if(markers.length===0){
    pushFact(blocks, text.trim());
    return blocks;
  }
  let cursor = 0;
  markers.forEach((m,k)=>{
    const factText = text.slice(cursor,m.index).trim();
    if(factText) pushFact(blocks, factText);
    const chunkEnd = k+1<markers.length ? markers[k+1].index : text.length;
    const chunk = text.slice(m.index+m[0].length, chunkEnd);
    if(/문\s*제/.test(m[0])){
      const {question,rest} = splitQuestionRun(chunk);
      if(question) blocks.push({type:'question', text:question});
      if(rest) pushFact(blocks, rest);
    } else {
      const t = chunk.trim();
      if(t) blocks.push({type:'ref', text:t});
    }
    cursor = chunkEnd;
  });
  return blocks;
}

function useTheme(){
  const [theme,setTheme] = useState(()=>document.documentElement.getAttribute('data-theme')||'light');
  const toggle = ()=>{
    const n = theme==='light'?'dark':'light';
    setTheme(n);
    document.documentElement.setAttribute('data-theme', n);
    localStorage.setItem('cp_theme', n);
  };
  return [theme, toggle];
}

// ══════════════════════════════════════════════
function App(){
  const [ready,setReady] = useState(false);
  const [meta,setMeta]   = useState(null);
  const [exams,setExams] = useState([]);
  const [issues,setIssues]=useState([]);
  const [byIssue,setByIssue]=useState({});
  const [casebookToc,setCasebookToc]=useState(null);
  const [err,setErr]     = useState(null);
  const [theme,toggleTheme] = useTheme();

  const [uid,setUid] = useState(null);
  const [uidInput,setUidInput] = useState("");
  const [round,setRound] = useState(1);
  const [prog,setProg] = useState({});
  const [records,setRecords] = useState([]);

  const [view,setView] = useState("list");
  const [curId,setCurId] = useState(null);
  const [focusGroupKey,setFocusGroupKey] = useState(null);
  const [mode,setMode]   = useState(INCOMING_ISSUE ? "issue" : "exam");  // exam | issue
  const [fType,setFType] = useState("all");
  const [fIssue,setFIssue]=useState(INCOMING_ISSUE);
  const [fDone,setFDone] = useState("all");

  useEffect(()=>{ (async()=>{
    try{
      const st = await Store.init({});
      setUid(st.uid);
      const r = await fetch(`data/${SUBJECT}/index.json`);
      if(!r.ok) throw new Error(`data/${SUBJECT}/index.json 로드 실패 (${r.status})`);
      const j = await r.json();
      setMeta(j.meta); setExams(j.exams); setIssues(j.issues); setByIssue(j.byIssue);
      fetch(`data/${SUBJECT}/casebook_toc.json`).then(r2=>r2.ok?r2.json():null)
        .then(tj=>tj && setCasebookToc(tj)).catch(()=>{});
      setReady(true);
    }catch(e){ setErr(e.message); }
  })(); },[]);

  const reload = useCallback(async(u=uid,r=round)=>{
    if(!u) return;
    setProg(await Store.getProgress(SUBJECT,r));
    setRecords(await Store.getRecords({subject:SUBJECT}));
  },[uid,round]);
  useEffect(()=>{ if(uid) reload(uid,round); },[uid,round,reload]);

  if(err) return <div className="wrap"><div className="card" style={{borderColor:'var(--no)'}}>
    <b>불러오기 오류</b><div className="muted" style={{marginTop:8}}>{err}</div>
    <div className="muted" style={{marginTop:10,lineHeight:1.75}}>
      파일을 직접 열면(<code>file://</code>) 브라우저 보안정책 때문에 데이터를 못 읽습니다.<br/>
      이 폴더에서 <code>python -m http.server 8000</code> 실행 후 접속하세요.
    </div></div></div>;
  if(!ready) return <div className="loading">⚖ 불러오는 중...</div>;

  if(!uid) return (
    <div className="wrap" style={{maxWidth:430,paddingTop:70}}>
      <div className="card">
        <h1 style={{margin:'0 0 4px',fontSize:20}}>사례형 연습 · {SUBJECT}</h1>
        <div className="muted" style={{marginBottom:16}}>
          변호사시험 15회 + 모의고사 40회 · 문제 · 채점기준표 · 모범답안
        </div>
        <input type="text" placeholder="사용자 ID" value={uidInput} style={{width:'100%',marginBottom:10}}
          onChange={e=>setUidInput(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter'&&uidInput.trim()){ Store.setUser(uidInput.trim()); setUid(uidInput.trim()); } }} />
        <button className="btn pri" style={{width:'100%'}} disabled={!uidInput.trim()}
          onClick={()=>{ Store.setUser(uidInput.trim()); setUid(uidInput.trim()); }}>시작하기</button>
        <div className="muted" style={{marginTop:13,fontSize:11.5,lineHeight:1.7}}>
          {Store.isRemote()? "기기 간 동기화 활성":"이 기기에 저장됩니다"} · 답안 전문은 기기 밖으로 나가지 않습니다
        </div>
      </div>
    </div>
  );

  const cur = curId ? exams.find(e=>e.id===curId) : null;
  const issueMap = Object.fromEntries(issues.map(i=>[i.id,i]));

  return (
    <div>
      <div className="hd">
        <div>
          <h1>사례형 연습 · {SUBJECT}</h1>
          <div className="sub">{uid} · {round}회독 · {Object.keys(prog).length}/{meta.examCount} 완료</div>
        </div>
        <div className="row">
          <button className="btn ghost" onClick={toggleTheme} title="테마 전환">
            {theme==='light'?'🌙':'☀'}</button>
          <select className="btn" value={round} onChange={e=>setRound(Number(e.target.value))}>
            {ROUNDS.map(r=><option key={r} value={r}>{r}회독</option>)}
          </select>
          <button className="btn ghost" onClick={()=>{ Store.setUser(null); setUid(null); setCurId(null); }}>나가기</button>
        </div>
      </div>

      <div className="wrap">
        <div className="tabs">
          {[["list","문제 풀기"],["history","답안 이력"],["stats","진도·약점"]].map(([k,l])=>
            <div key={k} className={"tab"+(view===k?" on":"")}
              onClick={()=>{setView(k);setCurId(null);}}>{l}</div>)}
        </div>

        {view==="solve" && cur &&
          <Solve exam={cur} issueMap={issueMap} round={round} focusIssue={mode==="issue"?fIssue:null}
            focusGroupKey={focusGroupKey}
            onBack={()=>{setView("list");setCurId(null);setFocusGroupKey(null);}}
            onSubmitted={()=>reload()} />}

        {view==="list" &&
          <ExamList exams={exams} issues={issues} issueMap={issueMap} prog={prog} byIssue={byIssue}
            casebookToc={casebookToc}
            mode={mode} setMode={setMode}
            fType={fType} setFType={setFType} fIssue={fIssue} setFIssue={setFIssue}
            fDone={fDone} setFDone={setFDone} incoming={INCOMING_ISSUE}
            onPick={(id,groupKey)=>{setCurId(id);setFocusGroupKey(groupKey||null);setView("solve");}} />}

        {view==="history" &&
          <History records={records} issueMap={issueMap}
            onOpen={id=>{setCurId(id);setFocusGroupKey(null);setView("solve");}}
            onDelete={async at=>{ await Store.deleteRecord(at); reload(); }} />}

        {view==="stats" &&
          <Stats exams={exams} issues={issues} prog={prog} records={records}
            byIssue={byIssue}
            onPickIssue={id=>{ setMode("issue"); setFIssue(id); setView("list"); }} />}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════
function ExamList({exams,issues,issueMap,prog,byIssue,casebookToc,mode,setMode,
                   fType,setFType,fIssue,setFIssue,fDone,setFDone,incoming,onPick}){
  const [showAll,setShowAll] = useState(false);
  const [q,setQ] = useState("");
  const [issueSub,setIssueSub] = useState(fIssue ? "tag" : "toc");

  // ── 쟁점별 모드 ──
  if(mode==="issue"){
    const kw = q.trim();
    const list = issues.filter(it=> !kw || it.label.includes(kw) || it.id.includes(kw));
    const sel = fIssue ? issueMap[fIssue] : null;
    const selExams = fIssue ? (byIssue[fIssue]||[]).map(id=>exams.find(e=>e.id===id)).filter(Boolean) : [];

    return (
      <div>
        <ModeSwitch mode={mode} setMode={setMode} />
        {incoming && fIssue===incoming && sel &&
          <div className="banner"><b>{sel.label}</b> 쟁점으로 이동했습니다.
            <span className="muted"> (다른 페이지에서 연결)</span></div>}

        <div className="row" style={{marginBottom:12}}>
          {[["toc","사례집 목차로 풀기"],["tag","쟁점 검색"]].map(([k,l])=>
            <span key={k} className={"tag click"+(issueSub===k?" on":"")}
              style={{padding:'7px 15px',fontSize:12.5}} onClick={()=>setIssueSub(k)}>{l}</span>)}
        </div>

        {issueSub==="toc" &&
          (casebookToc
            ? <CasebookBrowser casebookToc={casebookToc} onPick={onPick} />
            : <div className="empty">사례집 목차 데이터가 없습니다.</div>)}

        {issueSub==="tag" && <div>
          <div className="card">
            <div className="title">쟁점 선택 <span className="muted" style={{fontWeight:400}}>— 한 쟁점만 골라 그 지문들만 풀 수 있습니다</span></div>
            <input type="text" placeholder="쟁점 검색 (예: 과잉금지, 원고적격)" value={q}
              onChange={e=>setQ(e.target.value)} style={{width:'100%',marginBottom:11}} />
            <div className="row">
              {(showAll? list : list.slice(0,40)).map(it=>
                <span key={it.id} className={"tag click"+(fIssue===it.id?" on":"")} title={it.id}
                  onClick={()=>setFIssue(fIssue===it.id?null:it.id)}>{it.label} {it.examCount}</span>)}
              {list.length>40 &&
                <span className="tag click" onClick={()=>setShowAll(v=>!v)}>
                  {showAll?"접기":`+${list.length-40} 더보기`}</span>}
            </div>
          </div>

          {!fIssue && <div className="empty">위에서 쟁점을 고르면 해당 지문 목록이 나옵니다.</div>}

          {fIssue && sel &&
            <div>
              <div className="row" style={{margin:'14px 2px 9px',justifyContent:'space-between'}}>
                <div className="row">
                  <b style={{fontSize:15}}>{sel.label}</b>
                  <span className="tag">{sel.path?.join(' › ')}</span>
                  <span className="muted">{selExams.length}개 지문</span>
                </div>
                <button className="btn" onClick={()=>setFIssue(null)}>다른 쟁점</button>
              </div>
              {selExams.map(e=>
                <ExamCard key={e.id} e={e} prog={prog} issueMap={issueMap}
                  highlight={fIssue} onPick={onPick} />)}
            </div>}
        </div>}
      </div>
    );
  }

  // ── 회차별 모드 ──
  let list = exams;
  if(fType!=="all")  list=list.filter(e=>e.examType===fType);
  if(fDone==="todo") list=list.filter(e=>!prog[e.id]);
  if(fDone==="done") list=list.filter(e=>prog[e.id]);

  return (
    <div>
      <ModeSwitch mode={mode} setMode={setMode} />
      <div className="card">
        <div className="row" style={{marginBottom:9}}>
          <span className="muted" style={{minWidth:44}}>구분</span>
          {[["all","전체"],["실제기출","변호사시험"],["모의고사","모의고사"]].map(([k,l])=>
            <span key={k} className={"tag click"+(fType===k?" on":"")} onClick={()=>setFType(k)}>{l}</span>)}
        </div>
        <div className="row">
          <span className="muted" style={{minWidth:44}}>진행</span>
          {[["all","전체"],["todo","안 푼 것"],["done","푼 것"]].map(([k,l])=>
            <span key={k} className={"tag click"+(fDone===k?" on":"")} onClick={()=>setFDone(k)}>{l}</span>)}
        </div>
      </div>
      <div className="muted" style={{margin:'13px 2px 8px'}}>{list.length}건</div>
      {list.length===0 && <div className="empty">조건에 맞는 문제가 없습니다.</div>}
      {list.map(e=><ExamCard key={e.id} e={e} prog={prog} issueMap={issueMap} onPick={onPick}/>)}
    </div>
  );
}

function CasebookBrowser({casebookToc,onPick}){
  const books = Object.keys(casebookToc);
  const [book,setBook] = useState(books[0]);
  const [openParts,setOpenParts] = useState(()=>new Set([0]));

  useEffect(()=>{ setOpenParts(new Set([0])); },[book]);

  const data = casebookToc[book];
  if(!data) return null;

  const toggle = pi => setOpenParts(s=>{
    const n=new Set(s); n.has(pi)?n.delete(pi):n.add(pi); return n;
  });

  return (
    <div>
      <div className="row" style={{marginBottom:11,justifyContent:'space-between'}}>
        <div className="row">
          {books.map(b=>
            <span key={b} className={"tag click"+(book===b?" on":"")} onClick={()=>setBook(b)}>{b}</span>)}
        </div>
        <span className="muted">{data.meta?.title}</span>
      </div>
      {data.parts.map((p,pi)=>{
        const isOpen = openParts.has(pi);
        return (
          <div key={pi} className="card" style={{padding:0,overflow:'hidden'}}>
            <div className="row click" style={{justifyContent:'space-between',padding:'11px 14px'}}
              onClick={()=>toggle(pi)}>
              <b style={{fontSize:14}}>{p.title}</b>
              <span className="muted">{p.cases.length}개 사례 {isOpen?'▲':'▼'}</span>
            </div>
            {isOpen && <div style={{borderTop:'1px solid var(--bd2)'}}>
              {p.cases.map(c=>{
                const clickable = !!(c.examId && c.groupKey);
                return (
                  <div key={c.caseNo} className={"row"+(clickable?" click":"")}
                    style={{justifyContent:'space-between',padding:'9px 14px',
                      borderBottom:'1px solid var(--bd2)',flexWrap:'nowrap',
                      opacity:clickable?1:.45,cursor:clickable?'pointer':'default'}}
                    onClick={()=>clickable && onPick(c.examId,c.groupKey)}
                    title={clickable?"":"연결된 문제를 찾지 못했습니다 (데이터 범위 밖이거나 인식 오류)"}>
                    <div style={{minWidth:0,flex:1}}>
                      <div style={{fontSize:13.5}}>
                        <span className="muted">사례{c.caseNo}.</span> {c.source}
                      </div>
                      <div className="muted" style={{fontSize:12.5,marginTop:2}}>{c.label}</div>
                    </div>
                    {!clickable && <span className="tag">미연결</span>}
                  </div>
                );
              })}
            </div>}
          </div>
        );
      })}
    </div>
  );
}

function ModeSwitch({mode,setMode}){
  return (
    <div className="row" style={{marginBottom:12}}>
      {[["exam","회차별로 풀기"],["issue","쟁점별로 풀기"]].map(([k,l])=>
        <span key={k} className={"tag click"+(mode===k?" on":"")}
          style={{padding:'7px 15px',fontSize:12.5}} onClick={()=>setMode(k)}>{l}</span>)}
    </div>
  );
}

function ExamCard({e,prog,issueMap,highlight,onPick}){
  return (
    <div className="card" style={{cursor:'pointer'}} onClick={()=>onPick(e.id)}>
      <div className="row" style={{justifyContent:'space-between',marginBottom:5}}>
        <div className="row">
          <span className={"tag"+(e.examType==="실제기출"?" gold":"")}>
            {e.examType==="실제기출"?"변호사시험":"모의고사"}</span>
          <b style={{fontSize:15}}>{e.label}</b>
          {prog[e.id] && <span className="tag ok">완료</span>}
        </div>
        <div className="muted">
          {e.groups?.length||0}문 · {e.questions.length}설문{e.totalPoints>0?` · ${e.totalPoints}점`:""}
        </div>
      </div>
      {e.factSummary &&
        <div className="muted" style={{fontSize:13,lineHeight:1.7,margin:'5px 0 9px'}}>{e.factSummary}</div>}
      <div className="row">
        {e.issueIds.slice(0,8).map(i=>
          <span key={i} className={"tag"+(highlight===i?" gold":"")}>{issueMap[i]?.label||i}</span>)}
        {e.issueIds.length>8 && <span className="muted">+{e.issueIds.length-8}</span>}
      </div>
      <div className="row" style={{marginTop:9}}>
        {e.hasRubric   && <span className="tag ok">채점기준표</span>}
        {e.hasCasebook && <span className="tag ok">모범답안</span>}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════
function Solve({exam,issueMap,round,focusIssue,focusGroupKey,onBack,onSubmitted}){
  const [detail,setDetail] = useState(null);
  const [err,setErr]   = useState(null);
  const [page,setPage] = useState(0);            // 문항 그룹 인덱스
  const [answers,setAnswers] = useState({});     // {groupKey: text}
  const [reveal,setReveal] = useState(false);
  const [pane,setPane] = useState("rubric");
  const [cbIdx,setCbIdx] = useState(0);
  const [elapsed,setElapsed] = useState(0);
  const [saved,setSaved] = useState(false);
  const [showProblem,setShowProblem] = useState(true);
  const startRef = useRef(Date.now());

  useEffect(()=>{
    let alive=true;
    setDetail(null); setErr(null); setPage(0); setReveal(false); setCbIdx(0); setSaved(false);
    startRef.current=Date.now(); setElapsed(0);
    (async()=>{
      try{
        const r = await fetch(`data/공법/exams/${encodeURIComponent(exam.id)}.json`);
        if(!r.ok) throw new Error("문제 상세 로드 실패");
        const j = await r.json();
        if(!alive) return;
        setDetail(j);
        const groups = j.groups?.length ? j.groups : [{key:"전체",label:"전체",questions:j.questions||[]}];
        const drafts = {};
        for(const g of groups) drafts[g.key] = await Store.getDraft(`${exam.id}::${g.key}`) || "";
        if(alive) setAnswers(drafts);
        if(focusGroupKey){
          const gi = groups.findIndex(g=>g.key===focusGroupKey);
          if(alive && gi>=0) setPage(gi);
        }
      }catch(e){ if(alive) setErr(e.message); }
    })();
    return ()=>{ alive=false; };
  },[exam.id,focusGroupKey]);

  useEffect(()=>{
    const t=setInterval(()=>setElapsed(Math.floor((Date.now()-startRef.current)/1000)),1000);
    return ()=>clearInterval(t);
  },[exam.id]);

  const groups = detail?.groups?.length ? detail.groups
    : (detail ? [{key:"전체",label:"전체",questions:detail.questions||[],points:0}] : []);
  const g = groups[page];

  const setAnswer = (key,val)=>{
    setAnswers(a=>({...a,[key]:val})); setSaved(false);
    clearTimeout(setAnswer._t);
    setAnswer._t = setTimeout(()=>Store.setDraft(`${exam.id}::${key}`, val), 600);
  };

  if(err) return <div className="card" style={{borderColor:'var(--no)'}}>{err}
    <div><button className="btn" style={{marginTop:10}} onClick={onBack}>목록으로</button></div></div>;
  if(!detail || !g) return <div className="card">불러오는 중...</div>;

  const filled = groups.filter(x=>(answers[x.key]||"").trim()).length;
  const totalChars = Object.values(answers).reduce((s,t)=>s+(t||"").trim().length,0);

  const submit = async()=>{
    const parts = groups.map(x=>{
      const t=(answers[x.key]||"").trim();
      return t? `【${x.label}】\n${t}` : null;
    }).filter(Boolean);
    if(!parts.length) return;
    await Store.record({
      subject:"공법", mode:"case", examId:exam.id, label:exam.label,
      round, issueIds:exam.issueIds, text:parts.join("\n\n"), seconds:elapsed,
    });
    const p = await Store.getProgress("공법",round);
    await Store.setProgress("공법",round,{...p,[exam.id]:{done:true,at:Date.now()}});
    setSaved(true); setReveal(true);
    onSubmitted && onSubmitted();
  };

  const cb = detail.casebookAnswers||[];

  return (
    <div>
      <div className="row" style={{justifyContent:'space-between',marginBottom:11}}>
        <button className="btn" onClick={onBack}>← 목록</button>
        <div className="row">
          <span className="muted">경과 {mmss(elapsed)}</span>
          <span className="muted">· 작성 {filled}/{groups.length}문 · {totalChars}자</span>
        </div>
      </div>

      <div className="card">
        <div className="row" style={{marginBottom:7}}>
          <span className={"tag"+(exam.examType==="실제기출"?" gold":"")}>
            {exam.examType==="실제기출"?"변호사시험":"모의고사"}</span>
          <b style={{fontSize:16}}>{exam.label}</b>
        </div>
        <div className="row">{exam.issueIds.map(i=>
          <span key={i} className={"tag"+(focusIssue===i?" gold":"")} title={i}>
            {issueMap[i]?.label||i}</span>)}</div>
      </div>

      {/* 문항 페이지 네비게이션 */}
      {groups.length>1 &&
        <div className="pager">
          <button className="btn" disabled={page===0} onClick={()=>setPage(p=>p-1)}>← 이전</button>
          <div className="pagedots">
            {groups.map((x,i)=>
              <span key={x.key}
                className={"dot"+(i===page?" on":"")+((answers[x.key]||"").trim()?" filled":"")}
                onClick={()=>setPage(i)} title={`${x.label} (${x.questions.length}설문)`}>{x.label}</span>)}
          </div>
          <button className="btn" disabled={page===groups.length-1} onClick={()=>setPage(p=>p+1)}>다음 →</button>
        </div>}

      {/* 현재 문의 설문 */}
      <div className="card">
        <div className="row" style={{justifyContent:'space-between',marginBottom:9}}>
          <div className="title" style={{margin:0}}>{g.label}</div>
          {g.points>0 && <span className="tag">{g.points}점</span>}
        </div>
        {g.questions.map((q,i)=>
          <div key={i} className="kv">
            <b>{q.no}</b><span style={{flex:1}}>{q.ask}</span>
            {q.points!=null && <span className="muted">{q.points}점</span>}
          </div>)}
      </div>

      {/* 문제 지문 (접기 가능) */}
      <div className="card">
        <details className="prob" open={showProblem} onToggle={e=>setShowProblem(e.target.open)}>
          <summary>문제 지문 {showProblem? "접기":"펼치기"}</summary>
          <div>
            {splitProblemText(detail.problemText).map((b,i)=>
              <div key={i} className={"pre "+(b.type==='fact'?'factbox':b.type==='question'?'qtext':'refbox')}>
                {b.text}
              </div>)}
          </div>
        </details>
      </div>

      {/* 답안 작성 (문항별) */}
      <div className="card">
        <div className="title">
          {g.label} 답안 작성 {saved && <span className="tag ok">기록됨</span>}
        </div>
        <textarea value={answers[g.key]||""} onChange={e=>setAnswer(g.key,e.target.value)}
          placeholder={`${g.label}에 대한 답안을 작성하세요. 자동 임시저장됩니다.`} />
        <div className="row" style={{marginTop:9,justifyContent:'space-between'}}>
          <span className="muted">{(answers[g.key]||"").trim().length}자</span>
          <div className="row">
            {page>0 && <button className="btn" onClick={()=>setPage(p=>p-1)}>← 이전 문</button>}
            {page<groups.length-1 && <button className="btn" onClick={()=>setPage(p=>p+1)}>다음 문 →</button>}
          </div>
        </div>
      </div>

      <div className="row" style={{margin:'14px 0 10px'}}>
        <button className="btn pri" onClick={submit} disabled={filled===0}>
          전체 답안 제출 · 기록 ({filled}/{groups.length}문)</button>
        <button className="btn" onClick={()=>setReveal(v=>!v)}>
          {reveal?"모범답안 접기":"모범답안 보기"}</button>
        <button className="btn" onClick={async()=>{
          setAnswer(g.key,""); await Store.clearDraft(`${exam.id}::${g.key}`);
        }}>이 문 비우기</button>
      </div>

      {reveal &&
        <div className="card">
          <div className="tabs" style={{marginBottom:12}}>
            {detail.rubricText &&
              <div className={"tab"+(pane==="rubric"?" on":"")} onClick={()=>setPane("rubric")}>채점기준표</div>}
            {cb.length>0 &&
              <div className={"tab"+(pane==="casebook"?" on":"")} onClick={()=>setPane("casebook")}>
                사례집 모범답안 ({cb.length})</div>}
          </div>
          {pane==="rubric" && (detail.rubricText
            ? <div className="pre">{detail.rubricText}</div>
            : <div className="empty">이 시험은 공식 채점기준표가 공개되지 않았습니다.<br/>
                사례집 모범답안 탭을 참고하세요.</div>)}
          {pane==="casebook" && cb.length>0 &&
            <div>
              <div className="row" style={{marginBottom:11}}>
                {cb.map((b,i)=><span key={i} className={"tag click"+(cbIdx===i?" on":"")}
                  onClick={()=>setCbIdx(i)}>{b.author} {b.caseNo}</span>)}
              </div>
              <div className="muted" style={{marginBottom:9}}>{cb[cbIdx].header}</div>
              <div className="pre">{cb[cbIdx].answerText}</div>
            </div>}
          {(detail.caseCitations?.length>0||detail.statutes?.length>0) &&
            <div style={{marginTop:15,paddingTop:13,borderTop:'1px solid var(--bd2)'}}>
              {detail.caseCitations?.length>0 &&
                <div style={{marginBottom:10}}>
                  <div className="muted" style={{marginBottom:6}}>관련 판례</div>
                  <div className="row">{detail.caseCitations.slice(0,25).map(c=>
                    <span key={c} className="tag">{c}</span>)}</div></div>}
              {detail.statutes?.length>0 &&
                <div><div className="muted" style={{marginBottom:6}}>관련 조문</div>
                  <div className="row">{detail.statutes.map(s=><span key={s} className="tag">{s}</span>)}</div></div>}
            </div>}
        </div>}
    </div>
  );
}

// ══════════════════════════════════════════════
function History({records,issueMap,onOpen,onDelete}){
  if(!records.length) return <div className="empty">아직 제출한 답안이 없습니다.</div>;
  return (
    <div>
      <div className="muted" style={{margin:'0 2px 10px'}}>{records.length}건</div>
      {records.map(a=>(
        <div key={a.at} className="card">
          <div className="row" style={{justifyContent:'space-between',marginBottom:6}}>
            <div className="row"><b>{a.label}</b><span className="tag">{a.round}회독</span></div>
            <div className="muted">{fmtDate(a.at)}</div>
          </div>
          <div className="row" style={{marginBottom:8}}>
            <span className="muted">{a.chars}자</span>
            <span className="muted">· {Math.floor(a.seconds/60)}분 {a.seconds%60}초</span>
          </div>
          {a.issueIds?.length>0 &&
            <div className="row" style={{marginBottom:9}}>
              {a.issueIds.slice(0,6).map(i=><span key={i} className="tag">{issueMap[i]?.label||i}</span>)}
            </div>}
          <details><summary className="muted" style={{cursor:'pointer'}}>답안 전문 보기</summary>
            <div className="pre" style={{marginTop:10,padding:12,background:'var(--sf2)',borderRadius:8}}>
              {a.text}</div></details>
          <div className="row" style={{marginTop:10}}>
            <button className="btn" onClick={()=>onOpen(a.examId)}>다시 풀기</button>
            <button className="btn" onClick={()=>{ if(confirm("이 기록을 지울까요?")) onDelete(a.at); }}>삭제</button>
          </div>
        </div>))}
    </div>
  );
}

// ══════════════════════════════════════════════
function Stats({exams,issues,prog,records,byIssue,onPickIssue}){
  const done=new Set(Object.keys(prog));
  const real=exams.filter(e=>e.examType==="실제기출");
  const mock=exams.filter(e=>e.examType==="모의고사");
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const rd=real.filter(e=>done.has(e.id)).length, md=mock.filter(e=>done.has(e.id)).length;

  const stat=issues.map(it=>{
    const all=byIssue[it.id]||[];
    return {...it, all:all.length, done:all.filter(id=>done.has(id)).length};
  }).filter(s=>s.all>0).sort((a,b)=>(a.done/a.all)-(b.done/b.all)||b.all-a.all);

  const weak=stat.filter(s=>s.done===0&&s.all>=3);
  const sec=records.reduce((s,a)=>s+a.seconds,0), chars=records.reduce((s,a)=>s+a.chars,0);

  return (
    <div>
      <div className="grid c2">
        <div className="card">
          <div className="title">진도</div>
          {[["변호사시험",rd,real.length],["모의고사",md,mock.length]].map(([l,d,t])=>
            <div key={l} style={{marginBottom:11}}>
              <div className="row" style={{justifyContent:'space-between',marginBottom:5}}>
                <span>{l}</span><span className="muted">{d}/{t} ({pct(d,t)}%)</span></div>
              <div className="bar"><i style={{width:pct(d,t)+"%"}}/></div>
            </div>)}
        </div>
        <div className="card">
          <div className="title">누적</div>
          <div className="kv"><b>제출 답안</b><span>{records.length}건</span></div>
          <div className="kv"><b>총 작성량</b><span>{chars.toLocaleString()}자</span></div>
          <div className="kv"><b>총 소요시간</b><span>{Math.floor(sec/3600)}시간 {Math.floor(sec%3600/60)}분</span></div>
          <div className="kv" style={{borderBottom:'none'}}><b>평균 작성량</b>
            <span>{records.length?Math.round(chars/records.length).toLocaleString():0}자</span></div>
        </div>
      </div>

      {weak.length>0 &&
        <div className="card">
          <div className="title">한 번도 안 푼 빈출 쟁점
            <span className="muted" style={{fontWeight:400}}> — 3회 이상 출제 · 클릭하면 그 쟁점만 풀기</span></div>
          <div className="row">
            {weak.slice(0,24).map(s=>
              <span key={s.id} className="tag click" style={{borderColor:'var(--no)',color:'var(--no)'}}
                onClick={()=>onPickIssue(s.id)}>{s.label} {s.all}</span>)}
          </div>
        </div>}

      <div className="card">
        <div className="title">쟁점별 진도 <span className="muted" style={{fontWeight:400}}>— 안 푼 쟁점이 위로</span></div>
        {stat.slice(0,45).map(s=>(
          <div key={s.id} style={{marginBottom:9,cursor:'pointer'}} onClick={()=>onPickIssue(s.id)}>
            <div className="row" style={{justifyContent:'space-between',marginBottom:4}}>
              <span style={{fontSize:13.5}}>{s.label}</span>
              <span className="muted">{s.done}/{s.all}</span></div>
            <div className="bar"><i style={{width:pct(s.done,s.all)+"%",
              background:s.done===0?"var(--no)":s.done<s.all?"var(--gold2)":"var(--ok)"}}/></div>
          </div>))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
