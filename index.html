<!-- Pretendard: 네 앱 공통 본문 폰트. dynamic-subset은 unicode-range로 쪼개져 있어
     실제로 화면에 쓰인 글자 조각만 내려받는다(한글 전체 폰트는 1MB가 넘는다). -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>사례형 연습 — 변호사시험</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script>
// 테마: MCQ와 동일한 토큰 체계. 기본 라이트.
(function(){
  var t = localStorage.getItem('cp_theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
/* ── MCQ(선택형 페이지)와 동일한 색 토큰 ─────────────── */
:root[data-theme="dark"]{
  --bg:#10192a; --sf:#172238; --sf2:#1d2d48; --bd:#284060; --bd2:#1e3254;
  --gold:#7ab8d8; --gold2:#9acce8; --gf:#2e6282;
  --tx:#cce6f8; --tx2:#6aa8cc; --tx3:#366078;
  --hd:#0c1424; --ok:#4ade80; --no:#f87171; --shadow:0 1px 3px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#ecf4fb; --sf:#ffffff; --sf2:#dceef8; --bd:#b4d0e8; --bd2:#cce0f2;
  --gold:#2464a0; --gold2:#2e74b5; --gf:#2a5f88;
  --tx:#192233; --tx2:#3a5870; --tx3:#5878a0;
  --hd:#16233a; --ok:#16a34a; --no:#dc2626; --shadow:0 1px 3px rgba(30,60,100,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:'Pretendard Variable',Pretendard,system-ui,-apple-system,
    "Segoe UI","Malgun Gothic",sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
#root{min-height:100vh}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--gold)}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
.wrap.wide{max-width:1840px;padding:16px 20px}

.hd{background:var(--hd);color:#e8f2fb;padding:13px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;z-index:30}
.hd h1{margin:0;font-size:16.5px;letter-spacing:-.02em;font-weight:700}
.hd .sub{font-size:11.5px;opacity:.72;margin-top:2px}

.btn{background:var(--sf);color:var(--tx);border:1px solid var(--bd);
  border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--gold2)}
.btn:disabled{opacity:.42;cursor:default}
.btn.ghost{background:transparent;color:#cfe3f5;border-color:rgba(255,255,255,.22)}
.btn.ghost:hover{border-color:#9acce8}
select.btn{padding:7px 10px}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;
  padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;
  background:var(--sf2);color:var(--tx2);border:1px solid var(--bd2)}
.tag.on{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:600}
.tag.gold{background:var(--sf2);color:var(--gold);border-color:var(--gold);font-weight:600}
.tag.ok{background:var(--sf2);color:var(--ok);border-color:var(--ok)}
.tag.click{cursor:pointer}
.tag.click:hover{border-color:var(--gold)}

/* 손가락으로 쓰는 기기에서 누를 것들을 키운다.
   필터·구분 칩(.tag.click)이 27px, 상단 버튼이 33~35px 라 손끝으로 집기 어려웠다
   (권장 44px). 마우스 화면은 지금 밀도가 알맞으므로 터치 기기에서만 손댄다. */
@media (pointer:coarse){
  .tag.click{min-height:36px;padding:8px 12px;display:inline-flex;align-items:center}
  .btn{min-height:40px}
  .btn.ghost{min-height:40px;padding:8px 13px}
  select.btn{min-height:40px}
}
.muted{color:var(--tx3);font-size:12px}
.title{font-size:14.5px;font-weight:700;margin:0 0 9px;color:var(--tx)}
.pre{white-space:pre-wrap;word-break:break-word;font-size:14.8px;line-height:1.9;
  color:var(--tx)}

/* AI 채점 결과. 채점은 흘러들어오므로 길이가 계속 늘어난다 — 카드 안에서만
   스크롤하게 두어 답안 칸이 밀려나지 않게 한다. */
.grade-card{border-color:var(--gold);max-height:52vh;overflow-y:auto}
.grade-err{color:var(--no);font-size:13.5px;margin-bottom:9px}

/* ── 채점 결과 보기 — 「빨간 펜으로 첨삭한 종이」 ──────────────
   전에는 마크다운을 평문으로 뿌려서 표의 |, 제목의 ##, 강조의 ** 가
   화면에 그대로 보였다. 아래 스타일은 그걸 사람이 읽는 모양으로 만든다. */
.gv-h{font-weight:700;margin:16px 0 8px;color:var(--tx)}
.gv-h2{font-size:15.5px;padding-bottom:5px;border-bottom:1px solid var(--bd2)}
.gv-h3{font-size:14px} .gv-h4{font-size:13.5px;color:var(--tx2)}
.gv-p{font-size:14.4px;line-height:1.85;margin:6px 0;color:var(--tx)}
.gv-li{font-size:14.2px;line-height:1.8;margin:5px 0 5px 14px;position:relative;color:var(--tx)}
.gv-li::before{content:"·";position:absolute;left:-11px;color:var(--tx3)}
.gv-t{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.gv-t th,.gv-t td{border:1px solid var(--bd2);padding:6px 8px;text-align:left;vertical-align:top}
.gv-t th{background:var(--sf2);font-weight:600;color:var(--tx2);white-space:nowrap}

/* 첨삭 카드 — 학생 문장 → 고칠 말 → 사유 */
.gv-card{border-left:3px solid var(--no);background:var(--sf2);
  border-radius:0 8px 8px 0;padding:10px 12px;margin:10px 0}
.gv-said{font-size:14px;line-height:1.8;color:var(--tx2)}
.gv-quote{color:var(--tx2)}
.gv-fixline{font-size:14.2px;line-height:1.85;margin-top:5px;color:var(--tx)}
.gv-del{color:var(--no);text-decoration:line-through;text-decoration-thickness:1.5px}
.gv-fix{color:var(--no);font-weight:700}
.gv-why{display:flex;gap:7px;align-items:baseline;margin-top:7px;
  font-size:13.2px;line-height:1.75;color:var(--tx2)}
.gv-tag{flex:none;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;
  background:var(--sf);border:1px solid var(--bd)}
.gv-bad .gv-tag{color:var(--no);border-color:var(--no)}
.gv-warn .gv-tag{color:var(--gold);border-color:var(--gold)}
.gv-good .gv-tag{color:var(--ok);border-color:var(--ok)}
.gv-mute .gv-tag{color:var(--tx3)}
.gv-good{border-color:var(--ok)}


textarea{width:100%;background:var(--sf);color:var(--tx);border:1px solid var(--bd);
  border-radius:10px;padding:14px;font-size:15px;line-height:1.9;font-family:inherit;
  resize:vertical;min-height:300px}
textarea:focus{outline:none;border-color:var(--gold)}

/* 답안 작성칸: 실제 답안지처럼 줄 표시 */
textarea.answer-sheet{
  line-height:28px;
  min-height:max(300px, calc(100vh - 330px));
  padding:14px 14px 14px 14px;
  background-image:repeating-linear-gradient(to bottom,
    transparent 0, transparent 27px, var(--bd2) 27px, var(--bd2) 28px);
  background-position:0 14px;
  background-repeat:repeat;
}
input[type=text]{background:var(--sf);color:var(--tx);border:1px solid var(--bd);
  border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit}
input[type=text]:focus{outline:none;border-color:var(--gold)}

.grid{display:grid;gap:10px}
@media(min-width:720px){.grid.c2{grid-template-columns:1fr 1fr}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.tab{padding:10px 14px;font-size:13.5px;color:var(--tx2);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:700}
.bar{height:6px;background:var(--sf2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold)}
.empty{text-align:center;color:var(--tx3);padding:44px 16px}
.kv{display:flex;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--bd2)}
.kv b{color:var(--tx2);font-weight:500;min-width:74px}
.banner{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;
  padding:11px 14px;margin-bottom:12px;font-size:13px}

/* 문제 풀이 화면: 왼쪽 문제 · 오른쪽 답안 2단 (스크롤 분리, 가운데 분할선으로 폭 조절) */
.solve-grid{display:grid;grid-template-columns:1fr 12px 1fr;gap:5px;align-items:start}
.solve-col{display:flex;flex-direction:column;gap:11px;min-width:0;
  max-height:calc(100vh - 90px);overflow-y:auto;padding:2px 4px 2px 2px}
.solve-col .card,.solve-col .pager{margin-bottom:0}

/* 가운데 드래그 분할선 */
.splitter{align-self:stretch;height:calc(100vh - 90px);cursor:col-resize;
  display:flex;align-items:center;justify-content:center;
  touch-action:none;user-select:none;border-radius:6px}
.splitter::before{content:"";width:3px;height:52px;border-radius:3px;
  background:var(--bd);transition:background .12s,height .12s}
.splitter:hover::before,.splitter:focus-visible::before,.splitter.on::before{
  background:var(--gold);height:100%}
.splitter:focus-visible{outline:none}
.solve-grid.dragging{cursor:col-resize;user-select:none}

@media(max-width:860px){
  .solve-grid{grid-template-columns:1fr !important}
  .solve-col{max-height:none;overflow:visible;padding:0}
  .splitter{display:none}
}

/* 문항 페이지 네비게이션 */
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--sf);border:1px solid var(--bd);border-radius:12px;
  padding:10px 13px;margin-bottom:11px;position:sticky;top:0;z-index:20;
  box-shadow:var(--shadow)}
.pagedots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:1}
.dot{min-width:34px;text-align:center;font-size:12px;padding:5px 9px;border-radius:7px;
  border:1px solid var(--bd);background:var(--sf2);color:var(--tx2);cursor:pointer}
.dot.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.dot.filled{border-color:var(--ok);color:var(--ok)}
.dot.on.filled{background:var(--ok);border-color:var(--ok);color:#fff}

details.prob>summary{cursor:pointer;font-size:13.5px;color:var(--tx2);
  padding:4px 0;user-select:none}
details.prob>summary:hover{color:var(--gold)}

/* 문제 화면: 지문/문제/조문 구분 */
.factbox{background:var(--sf2);border:1px solid var(--bd2);border-radius:10px;
  padding:14px 16px;margin-top:10px}
.qtext{font-weight:700;margin-top:14px}
.refbox{margin-top:14px;padding-top:12px;border-top:2px dashed var(--bd2);
  font-size:12.5px;line-height:1.75;color:var(--tx2)}
.caselabel{margin-top:18px;font-weight:700;font-size:13.5px;color:var(--gold)}
.caselabel:first-child{margin-top:0}
</style>
</head>
<body>
<div id="root"><div class="loading">⚖ 불러오는 중...</div></div>

<script>
const {
  useState,
  useEffect,
  useRef,
  useCallback
} = React;
const SUBJECTS = [{
  id: "공법",
  label: "공법"
}, {
  id: "형사법",
  label: "형사법"
}, {
  id: "민사법",
  label: "민사법"
},
// 선택과목 둘은 사례집이 없다. 표시해 두면 없는 파일을 부르지 않는다.
{
  id: "국제법",
  label: "국제법",
  noCasebook: true
}, {
  id: "국제거래법",
  label: "국제거래법",
  noCasebook: true
}];
const HAS_CASEBOOK = id => !SUBJECTS.find(s => s.id === id)?.noCasebook;
const ROUNDS = [1, 2, 3, 4];

// AI 채점 Worker 주소. 배포한 뒤 여기에 넣으면 채점 버튼이 켜진다.
// 비워 두면 채점 기능만 숨고 나머지는 그대로 돌아간다. (worker/README.md 참고)
// 채점 결과를 「선생님이 빨간 펜으로 첨삭한 종이」처럼 보이게 하는 뷰.
//
// 지금까지는 채점 결과(마크다운)를 <div class="pre"> 에 평문으로 뿌리고 있었다.
// 그래서 표의 `|`, 제목의 `##`, 강조의 `**` 가 화면에 그대로 노출됐다.
// 여기서 최소한의 마크다운만 직접 해석한다 — 라이브러리를 더 받지 않으려는 것이다
// (첫 화면 속도를 위해 babel 2.7MB 를 걷어낸 마당에 다시 늘릴 이유가 없다).
//
// 해석하는 것: ## 제목 / 표 / 인용(>) / **굵게** / ~~취소선~~ / [사유] 꼬리표 / 목록
// 첨삭 절의 세 줄 묶음(인용 → 고칠 말 → [사유])은 한 장의 「첨삭 카드」로 묶는다.

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 줄 안쪽 서식. 취소선은 지운 글자, 굵게는 고쳐 쓸 말로 쓴다.
function inline(s) {
  let t = esc(s);
  t = t.replace(/~~(.+?)~~/g, '<span class="gv-del">$1</span>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong class="gv-fix">$1</strong>');
  t = t.replace(/「(.+?)」/g, '<span class="gv-quote">「$1」</span>');
  return t;
}

// [사유] 꼬리표 — 종류에 따라 색을 달리해 한눈에 구분되게 한다.
const REASON_CLASS = {
  '판례 근거 부족': 'warn',
  '판례 오기': 'bad',
  '조문 오기': 'bad',
  '정확성 부족': 'warn',
  '포섭 누락': 'warn',
  '논리 비약': 'warn',
  '결론 오류': 'bad',
  '불필요': 'mute',
  '좋음': 'good'
};
function renderGrade(md) {
  const out = [];
  const lines = String(md || '').split('\n');
  let table = null; // 표를 모으는 중인지
  let card = null; // 첨삭 카드를 모으는 중인지

  const flushTable = () => {
    if (!table) return;
    const [head, ...body] = table;
    out.push('<table class="gv-t"><thead><tr>' + head.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>' + body.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>');
    table = null;
  };
  const flushCard = () => {
    if (!card) return;
    out.push(`<div class="gv-card">${card.join('')}</div>`);
    card = null;
  };
  for (const raw of lines) {
    const t = raw.trim();

    // 표
    if (t.startsWith('|') && t.endsWith('|')) {
      const cells = t.slice(1, -1).split('|').map(c => c.trim());
      if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue; // 구분줄
      (table = table || []).push(cells);
      continue;
    }
    flushTable();
    if (!t) {
      flushCard();
      continue;
    }

    // 제목
    const h = t.match(/^(#{2,4})\s+(.+)$/);
    if (h) {
      flushCard();
      const lv = h[1].length;
      out.push(`<div class="gv-h gv-h${lv}">${inline(h[2])}</div>`);
      continue;
    }

    // [사유] 꼬리표 — 첨삭 카드의 마지막 줄
    const r = t.match(/^>?\s*\[([^\]]+)\]\s*(.*)$/);
    if (r) {
      const kind = REASON_CLASS[r[1].trim()] || 'warn';
      (card = card || []).push(`<div class="gv-why gv-${kind}"><span class="gv-tag">${esc(r[1])}</span>` + `<span>${inline(r[2])}</span></div>`);
      continue;
    }

    // 인용줄 — 학생 문장 또는 고쳐 쓸 말
    if (t.startsWith('>')) {
      const body = t.replace(/^>\s?/, '');
      const isFix = /→/.test(body);
      (card = card || []).push(`<div class="${isFix ? 'gv-fixline' : 'gv-said'}">${inline(body)}</div>`);
      continue;
    }
    flushCard();

    // 목록
    const li = t.match(/^[-*]\s+(.+)$/) || t.match(/^(\d+\.\s+.+)$/);
    if (li) {
      out.push(`<div class="gv-li">${inline(li[1])}</div>`);
      continue;
    }
    out.push(`<div class="gv-p">${inline(t)}</div>`);
  }
  flushTable();
  flushCard();
  return out.join('');
}
const GRADER_URL = "https://case-grader.bar-exam.workers.dev";
const SPLIT_MIN = 25,
  SPLIT_MAX = 75; // 문제/답안 2단 폭 비율 한계(%)
const URLQ = new URLSearchParams(location.search);
const INCOMING_ISSUE = URLQ.get("issue");
// ?exam=민사법_로사정_003_사례 로 특정 문제를 바로 연다.
// 암기장(Core_Notes)의 CASE 링크가 이 주소로 들어온다. 과목은 id 앞머리에서 읽는다.
const INCOMING_EXAM = URLQ.get("exam");
const INCOMING_SUBJECT = INCOMING_EXAM ? INCOMING_EXAM.split("_")[0] : null;
// &group=제2문 을 덧붙이면 그 문항으로 바로 넘어간다. 기출은 한 시험에 논점이
// 여럿 섞여 있어 ?exam= 만으로는 시험 전체가 열려 단원 링크로 쓸 수 없다.
const INCOMING_GROUP = URLQ.get("group");
let incomingExamUsed = false;

// 문항 라벨의 근거. groupSource가 "시험지"면 원본 시험지에서 표제를 직접 읽은
