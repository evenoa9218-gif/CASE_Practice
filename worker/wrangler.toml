name = "case-grader"
main = "src/index.js"
compatibility_date = "2026-07-01"
# Anthropic SDK가 Node 내장 모듈(stream 등)을 쓴다.
compatibility_flags = ["nodejs_compat"]

# 실행 위치를 Cloudflare에 맡긴다.
#
# 기본값(요청자와 가까운 PoP)으로 두면 한국에서 부른 요청이 홍콩(HKG) PoP에서
# 실행되는 일이 있는데, Anthropic API는 홍콩을 미지원 지역으로 보고 키를 보기도
# 전에 403 "Request not allowed"로 끊는다. 증상이 간헐적이라 크레딧 문제나 키
# 문제로 오진하기 쉽다 — 실제로 cf-ray 끝의 PoP 코드를 봐야 드러난다.
# smart 모드는 Worker를 백엔드(여기서는 Anthropic API) 가까이 배치한다.
[placement]
mode = "smart"

[vars]
# 채점 깊이. high가 기본이고, medium으로 낮추면 응답이 빨라지는 대신
# 채점이 얕아진다. 비밀값이 아니므로 여기 둔다.
GRADE_EFFORT = "high"

# 채점에 쓸 수 있는 돈의 상한(달러). 넘으면 워커가 채점을 받지 않고 이유를 돌려준다.
# 기록형 한 건이 $0.6~1.1 이라 분당 요청 제한만으로는 요금을 못 막는다.
# 쓴 금액은 D1(grade-usage)에 쌓인 기록을 더해서 센다 — `npm run usage` 로 볼 수 있다.
DAILY_USD = "5"
MONTHLY_USD = "50"

# 분당 요청 제한. API 키는 Worker 안에 있지만 엔드포인트 자체는 공개라
# 이게 없으면 한 사람이 계속 호출해 요금을 태울 수 있다.
[[unsafe.bindings]]
name = "GRADE_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# API 키는 여기 적지 않는다. 배포 후 아래로 넣는다:
#   npx wrangler secret put ANTHROPIC_API_KEY

# Anthropic 호출의 출구 지역을 미국 동부로 고정하기 위한 통로.
# 상태는 담지 않는다 — `locationHint`를 쓰려고 Durable Object를 빌릴 뿐이다.
# (한국에서 부른 요청이 홍콩 PoP에서 나가면 Anthropic이 403으로 끊는다)
[[durable_objects.bindings]]
name = "US"
class_name = "UsRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsRelay"]

# 채점 사용량 기록(1건 1행). 월 비용 조회:
#   npx wrangler d1 execute grade-usage --remote --command "SELECT substr(ts,1,7) m, count(*) n, round(sum(cost_usd),2) usd FROM usage GROUP BY m"
[[d1_databases]]
binding = "USAGE_DB"
database_name = "grade-usage"
database_id = "07a0d799-d8cc-4a29-8a54-1894bc82361a"
migrations_dir = "migrations"
