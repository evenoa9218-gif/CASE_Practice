# GitHub Pages(Jekyll) 빌드 설정.
#
# 저장소 전체가 사이트로 게시되는데, 실제로 필요한 건 index.html · core/ · data/ 뿐이다.
# pipeline/(35MB, 스크립트·원본 블록)·worker/·docs/는 사이트에서 쓰이지 않으므로 뺀다.
# 게시 용량이 절반으로 줄고 빌드도 그만큼 가벼워진다. 제외해도 저장소에는 그대로 남는다.
#
# (2026-08-07 주: 이 파일은 처음에 Pages 빌드 실패의 원인 추정으로 넣었으나, 실제 원인은
#  "The job was not acquired by Runner of type hosted" — GitHub의 러너 할당 실패였다.
#  빌드 내용과 무관했다. 그래도 게시 대상을 줄이는 것 자체가 맞아 남겨 둔다.)
exclude:
  - pipeline
  - worker
  - docs
  - HANDOFF.md
  - README.md
